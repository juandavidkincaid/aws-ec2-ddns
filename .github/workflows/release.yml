name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Install Bun
        run: curl -fsSL https://bun.com/install | bash && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        run: pnpm build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/aws-ec2-ddns-linux-x64 \
            dist/aws-ec2-ddns-linux-arm64 \
            dist/aws-ec2-ddns-darwin-x64 \
            dist/aws-ec2-ddns-darwin-arm64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload install.sh to S3
        run: aws s3 cp install.sh s3://${{ secrets.AWS_S3_BUCKET }}/install.sh --content-type text/plain

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/install.sh"
